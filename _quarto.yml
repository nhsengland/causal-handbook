project:
  type: book
  output-dir: docs

book:
  title: "Causal Inference for Intervention & Service Evaluations: A Practical Handbook"
  author:
    - name: "Jamie Wong"
      orcid: 0000-0002-0052-5144
      email: jamie.wong@ucl.ac.uk
      url: https://profiles.ucl.ac.uk/95883-jamie-wong
      affiliation:
        - name: "University College London"
          url: https://www.ucl.ac.uk/
        - name: "NHS England Data Science"
          url: https://nhsengland.github.io/datascience/about/
        - name: "NHS North Central London ICB"
          url: https://nclhealthandcare.org.uk/icb/about/
  date: last-modified
  date-format: "DD MMM YYYY"
  search: true
  repo-url: https://github.com/nhsengland/causal-handbook
  repo-actions: [edit]
  downloads: [pdf]
  sharing: [twitter, facebook, linkedin]
  page-navigation: true
  page-footer: 
    left: "Copyright 2025, Jamie Wong" 
    right: 
      - icon: github
        href: https://github.com/nhsengland/causal-handbook
  favicon: images/nhs-logo-square.jpg
  chapters:

    - index.qmd

    - part: 01-00-intro.qmd
      chapters:
      - 01-01-background.qmd
      - 01-02-history.qmd
      - 01-03-assumptions.qmd
      - 01-04-existing-guidance.qmd
      - 01-05-selection-diagram.qmd
      - 01-06-key-resources.qmd
      - 01-07-text-method-coverage.qmd

    - part: 02-00-key-concepts.qmd
      chapters:
      - 02-01-rct.qmd
      - 02-02-dag.qmd
      - 02-03-tte.qmd
      - 02-04-strategies.qmd

    - part: 03-00-quasi-methods.qmd
      chapters:
      - 03-01-did.qmd
      - 03-02-its.qmd
      - 03-03-synth.qmd
      - 03-04-rdd.qmd
      - 03-05-iv.qmd
      - 03-06-ext.qmd

    - part: 04-00-adj-methods.qmd
      chapters:
      - 04-01-outreg.qmd
      - 04-02-match.qmd
      - 04-03-propensity.qmd
      - 04-04-gmethods.qmd
      - 04-05-ipw.qmd
      - 04-06-gformula.qmd
      - 04-07-ext.qmd

    - part: 05-00-case-studies.qmd
      chapters:
      - 05-01-doac-h2h.qmd
      - 05-02-doac-its.qmd
      - 05-03-oph-its.qmd

    - 06-barriers.qmd

    - 07-conclusion.qmd

    - 99-about.qmd

    - references.qmd

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - brand
  pdf:
    documentclass: scrreprt
    classoption:
      - oneside
    geometry:
      - margin=1in